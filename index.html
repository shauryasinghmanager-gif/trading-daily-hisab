<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ledger</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#0b0c10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  --bg: #0b0c10;
  --bg-elev: #14161c;
  --surface: #191c24;
  --surface-hover: #20242f;
  --border: #262a35;
  --border-soft: #1d2029;
  --text: #f2f0ea;
  --text-dim: #999eac;
  --text-faint: #5c6172;
  --profit: #5fb489;
  --profit-soft: rgba(95,180,137,0.14);
  --loss: #c1594b;
  --loss-soft: rgba(193,89,75,0.14);
  --accent: #c9a15a;
  --accent-soft: rgba(201,161,90,0.16);
  --font-display: 'Fraunces', ui-serif, Georgia, serif;
  --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  font-family: var(--font-body);
  color: var(--text);
  background: radial-gradient(circle at 50% 0%, #1a1d25 0%, #0a0b0e 70%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 12px;
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); }
.pnl-pos { color: var(--profit); }
.pnl-neg { color: var(--loss); }
.pnl-zero { color: var(--text-dim); }

/* Icon sizing: inline <svg> icons have no width/height attributes (only viewBox),
   so without CSS they fall back to the UA default of 300x150 and blow out any
   button/badge they sit in. This gives every icon a sane default, and .icon
   wrappers fill whatever explicit box they're given. */
svg:not([width]) { width: 1em; height: 1em; }
.icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon svg { width: 100%; height: 100%; display: block; }

#app-root {
  background: var(--bg);
  height: 700px;
  max-height: 90vh;
  width: 100%;
  max-width: 420px;
  border-radius: 26px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  box-shadow: 0 30px 60px rgba(0,0,0,0.45);
}
.app-shell { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
.app-main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.sidebar-header { display: none; }
.sidebar-add-btn { display: none; }

/* Base stacked layout for Home/Stats screens — gives every card a real gap
   from its neighbor so shadows don't bleed into the card below. Overridden
   by the grid layout in the desktop media query further down. */
.home-screen, .stats-screen { display: flex; flex-direction: column; gap: 14px; }

/* Full-screen, edge-to-edge on phones and when installed as an app */
@media (max-width: 859px), (display-mode: standalone), (display-mode: fullscreen) {
  body { padding: 0; align-items: stretch; }
  #app-root {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    max-width: none;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }
  .topbar { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .bottomnav { padding-bottom: env(safe-area-inset-bottom, 0px); height: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .fab { bottom: calc(82px + env(safe-area-inset-bottom, 0px)); }
  .screen { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
}

/* Desktop / large screens: real app shell — left sidebar, wide content, no phone card */
@media (min-width: 860px) {
  body { padding: 0; align-items: stretch; }
  #app-root {
    width: 100%;
    height: 100vh;
    max-height: none;
    max-width: none;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }
  .app-shell { flex-direction: row; }
  .bottomnav {
    position: static;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    width: 240px;
    height: 100%;
    padding: 22px 14px;
    gap: 3px;
    background: var(--bg-elev);
    border-top: none;
    border-right: 1px solid var(--border-soft);
    backdrop-filter: none;
  }
  .sidebar-header { display: block; padding: 4px 10px 26px; }
  .nav-item {
    flex-direction: row;
    justify-content: flex-start;
    width: 100%;
    font-size: 13.5px;
    padding: 10px 12px;
    gap: 11px;
    border-radius: 10px;
  }
  .nav-item svg { width: 17px; height: 17px; }
  .nav-item.active { background: var(--accent-soft); }
  .sidebar-add-btn { display: flex; margin: 4px 10px 18px; }
  .app-main { max-width: none; }
  .topbar { padding: 22px 34px 16px; }
  .screen { padding: 0 34px 48px; max-width: 1100px; }
  .fab { display: none !important; }

  .home-screen, .stats-screen { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 18px; align-items: start; }
  .home-screen { grid-template-areas: "hero heat" "risk heat" "recent recent"; }
  .home-hero { grid-area: hero; }
  .home-risk { grid-area: risk; }
  .home-heat { grid-area: heat; }
  .home-recent { grid-area: recent; }
  .home-heat { margin-top: 0 !important; }
  .home-hero .hero-figure { font-size: 44px !important; }
  .recent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .recent-grid .trade-card { margin-bottom: 0; }

  .stats-screen { grid-template-areas: "equity breakdown" "heat breakdown"; }
  .stats-equity { grid-area: equity; }
  .stats-heat { grid-area: heat; }
  .stats-breakdown { grid-area: breakdown; }

  .trades-toolbar { display: flex; align-items: center; gap: 12px; }
  .trades-toolbar .search-bar { flex: 1; margin-bottom: 0; }
  .trades-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .trades-grid .trade-card { margin-bottom: 0; }

  .settings-screen { max-width: 460px; }

  .sheet-backdrop { background: rgba(0,0,0,0.6); }
  .sheet {
    left: 50%; right: auto; bottom: auto; top: 50%;
    transform: translate(-50%, -46%);
    width: 420px; max-height: 84vh;
    border-radius: 18px;
    opacity: 0;
    transition: transform 220ms ease, opacity 220ms ease;
  }
  .sheet.open { transform: translate(-50%, -50%); opacity: 1; }
  .sheet-handle { display: none; }
}

.topbar {
  flex: 0 0 auto;
  padding: 18px 18px 12px;
  background: linear-gradient(180deg, var(--bg-elev), var(--bg));
  border-bottom: 1px solid var(--border-soft);
}
.screen {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px 16px 90px;
  animation: screen-in 220ms ease;
}
.screen::-webkit-scrollbar { width: 0; }
@keyframes screen-in {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .screen, .fab.invite, .fab, .sheet, .btn, .risk-fill { animation: none !important; transition: none !important; }
}
.bottomnav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 64px;
  background: rgba(23,26,33,0.92);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border-soft);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 30;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--text-faint);
  font-size: 10px; font-weight: 600;
  cursor: pointer; background: none; border: none;
  padding: 6px 10px; border-radius: 10px;
  font-family: var(--font-body);
  transition: color 120ms ease;
}
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 18px; height: 18px; }
.fab {
  position: fixed;
  right: 18px;
  bottom: 82px;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: linear-gradient(155deg, #d5ac6c, var(--accent));
  color: #14161c;
  display: flex; align-items: center; justify-content: center;
  border: none;
  box-shadow: 0 8px 20px rgba(201,161,90,0.35);
  cursor: pointer;
  z-index: 25;
  transition: transform 120ms ease;
}
.fab:active { transform: scale(0.92); }
@keyframes fab-invite {
  0%, 100% { box-shadow: 0 8px 20px rgba(217,164,65,0.35); }
  50% { box-shadow: 0 8px 28px rgba(201,161,90,0.65), 0 0 0 6px rgba(201,161,90,0.12); }
}
.fab.invite { animation: fab-invite 2.4s ease-in-out infinite; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 20px rgba(0,0,0,0.18);
}
.hero-card {
  position: relative;
  background: linear-gradient(160deg, #1d212b 0%, #14161c 100%);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px 22px 24px 32px;
  overflow: hidden;
  box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 14px 34px rgba(0,0,0,0.32);
}
/* Signature: faint ruled ledger-paper lines + the accountant's red margin rule */
.hero-card::before {
  content: "";
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0, transparent 30px,
    rgba(242,240,234,0.045) 30px, rgba(242,240,234,0.045) 31px
  );
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 18%, black 88%, transparent);
          mask-image: linear-gradient(to bottom, transparent, black 18%, black 88%, transparent);
  pointer-events: none;
}
.hero-card::after {
  content: "";
  position: absolute; left: 20px; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(193,89,75,0.4) 12%, rgba(193,89,75,0.4) 88%, transparent);
  pointer-events: none;
}
.hero-card > * { position: relative; z-index: 1; }
.hero-figure {
  font-family: var(--font-display);
  font-weight: 600;
  font-optical-sizing: auto;
  letter-spacing: -0.015em;
  font-variant-numeric: tabular-nums lining-nums;
}
.chip {
  font-size: 11.5px; font-weight: 600; padding: 6px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-dim);
  cursor: pointer; white-space: nowrap; font-family: var(--font-body);
}
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn {
  font-family: var(--font-body); font-weight: 600; font-size: 13px;
  border-radius: 10px; padding: 10px 16px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 120ms ease, transform 60ms ease, box-shadow 120ms ease, border-color 120ms ease;
}
.btn:hover { border-color: #363c4a; }
.btn:active { transform: scale(0.98); }
.btn-accent {
  background: linear-gradient(160deg, #d5ac6c, var(--accent));
  border-color: var(--accent); color: #14161c;
  box-shadow: 0 4px 14px rgba(201,161,90,0.25);
}
.btn-accent:hover { box-shadow: 0 6px 18px rgba(201,161,90,0.35); }
.btn-ghost { background: transparent; border-color: transparent; padding: 6px; }
.btn-ghost:hover { background: var(--surface-hover); border-color: transparent; }
.seg-btn {
  flex: 1; text-align: center; padding: 9px 0; font-family: var(--font-mono);
  font-weight: 600; font-size: 12px; letter-spacing: 0.04em; border-radius: 8px;
  cursor: pointer; border: 1px solid transparent; color: var(--text-dim);
}
.seg-long.active { background: var(--profit-soft); color: var(--profit); border-color: var(--profit); }
.seg-short.active { background: var(--loss-soft); color: var(--loss); border-color: var(--loss); }
.field-input {
  width: 100%; background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 9px; padding: 10px 12px; color: var(--text);
  font-family: var(--font-mono); font-size: 14px; outline: none;
}
.field-input:focus { border-color: var(--accent); }
.field-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--text-faint); font-weight: 600; margin-bottom: 5px; display: block;
}
.stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 600; }

.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  z-index: 40; opacity: 0; pointer-events: none; transition: opacity 200ms ease;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--bg-elev); border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  max-height: 88%;
  transform: translateY(100%);
  transition: transform 260ms cubic-bezier(.32,.72,0,1);
  z-index: 41;
  display: flex; flex-direction: column;
}
.sheet.open { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; border-radius: 3px; background: var(--border); margin: 10px auto 4px; }
.sheet-body { overflow-y: auto; padding: 8px 18px 22px; }

.trade-card { padding: 12px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; transition: border-color 150ms ease, transform 100ms ease; }
.trade-card:hover { border-color: #333849; }
.heat-cell { width: 11px; height: 11px; border-radius: 3px; border: 1px solid var(--border-soft); }
.risk-track { height: 6px; background: var(--bg-elev); border-radius: 4px; overflow: hidden; border: 1px solid var(--border-soft); }
.risk-fill { height: 100%; transition: width 300ms ease; }
.search-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
.search-bar input { background: transparent; border: none; outline: none; color: var(--text); font-family: var(--font-mono); font-size: 13px; flex: 1; }
</style>
</head>
<body>
<div id="app-root"></div>

<script>
/* ---------- icon helpers (inline SVG, no deps) ---------- */
const ICONS = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>',
  rows: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="6" rx="1"/><rect x="3" y="15" width="18" height="6" rx="1"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10M17 7v10H7"/></svg>',
};

/* ---------- helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => toLocalISO(new Date());
function toLocalISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
const fmtMoney = (n) => {
  const v = Number(n) || 0;
  const sign = v < 0 ? "-" : v > 0 ? "+" : "";
  return `${sign}$${Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
};
const pnlClass = (n) => (n > 0 ? "pnl-pos" : n < 0 ? "pnl-neg" : "pnl-zero");

/* Tasteful count-up: numbers settle into place rather than snapping, gives the ledger a pulse. */
let prevTotalShown = 0;
let prevTodayShown = 0;
let totalCountUpFrame = null;
let todayCountUpFrame = null;
function animateCountUp(el, from, to, duration, frameRef) {
  if (!el) return;
  if (frameRef.id) cancelAnimationFrame(frameRef.id);
  if (Math.abs(from - to) < 0.005) { el.textContent = fmtMoney(to); return; }
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = fmtMoney(from + (to - from) * eased);
    if (t < 1) frameRef.id = requestAnimationFrame(tick);
    else { el.textContent = fmtMoney(to); frameRef.id = null; }
  }
  frameRef.id = requestAnimationFrame(tick);
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function computePnl(t) {
  // New simplified format
  if (typeof t.pnl === "number") return t.pnl;
  if (t.pnl !== undefined && t.pnl !== null && t.pnl !== "") return Number(t.pnl) || 0;
  // Backward compatibility: entries saved under the old entry/exit/qty form
  if (t.entryPrice !== undefined && t.exitPrice !== undefined && t.exitPrice !== null && t.exitPrice !== "") {
    const entry = Number(t.entryPrice), exit = Number(t.exitPrice), qty = Number(t.qty) || 0, fees = Number(t.fees) || 0;
    const gross = t.side === "short" ? (entry - exit) * qty : (exit - entry) * qty;
    return gross - fees;
  }
  return 0;
}

/* ---------- state ---------- */
const state = {
  trades: [],
  dailyLimit: "",
  loaded: false,
  tab: "home",
  sheetOpen: false,
  editingId: null,
  search: "",
  filter: "all",
  saveError: false,
  storageBroken: false,
};

/* Detect whether localStorage actually persists in this environment
   (sandboxed iframes / private-mode / storage-blocked browsers can silently
   no-op or wipe on refresh — better to warn than lose data quietly). */
function storageWorks() {
  try {
    const k = "__ledger_probe__";
    localStorage.setItem(k, "1");
    const ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  } catch (e) { return false; }
}

/* ---------- storage (localStorage — this app runs standalone, installed to your device) ---------- */
async function loadData() {
  state.storageBroken = !storageWorks();
  try {
    const t = localStorage.getItem("journal_html:trades");
    if (t) state.trades = JSON.parse(t);
  } catch (e) {}
  try {
    const s = localStorage.getItem("journal_html:settings");
    if (s) {
      const parsed = JSON.parse(s);
      if (parsed.dailyLimit) state.dailyLimit = parsed.dailyLimit;
    }
  } catch (e) {}
  try {
    const savedTab = localStorage.getItem("journal_html:tab");
    if (savedTab && ["home", "trades", "stats", "settings"].includes(savedTab)) {
      state.tab = savedTab;
    }
  } catch (e) {}
  state.loaded = true;
  render();
}
async function persistTrades(next) {
  state.trades = next;
  try {
    localStorage.setItem("journal_html:trades", JSON.stringify(next));
    state.saveError = false;
  } catch (e) { state.saveError = true; }
  render();
}
async function persistSettings(limit) {
  state.dailyLimit = limit;
  try {
    localStorage.setItem("journal_html:settings", JSON.stringify({ dailyLimit: limit }));
    state.saveError = false;
  } catch (e) { state.saveError = true; }
}

/* ---------- derived data ---------- */
function getDerived() {
  const enriched = state.trades.map((t) => ({ ...t, pnl: computePnl(t) }));
  const dailyMap = {};
  enriched.forEach((t) => { dailyMap[t.date] = (dailyMap[t.date] || 0) + t.pnl; });
  const today = todayISO();
  const todayPnl = dailyMap[today] || 0;
  const totalPnl = enriched.reduce((s, t) => s + t.pnl, 0);
  const wins = enriched.filter((t) => t.pnl > 0).length;
  const winRate = enriched.length ? (wins / enriched.length) * 100 : 0;
  const limitNum = Number(state.dailyLimit) || 0;
  const limitPct = limitNum > 0 ? Math.min(100, (Math.abs(Math.min(0, todayPnl)) / limitNum) * 100) : 0;
  const limitBreached = limitNum > 0 && todayPnl <= -limitNum;

  // Stable date-only sort for the equity curve — same-day entries keep the order
  // they were stored in (array position), instead of being reshuffled by a
  // string comparison against their random ids.
  const sortedEntries = [...enriched].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  let cum = 0;
  const equityData = sortedEntries.map((t) => { cum += t.pnl; return { date: t.date, equity: cum }; });

  const days = []; const base = new Date(); base.setHours(0, 0, 0, 0);
  for (let i = 55; i >= 0; i--) {
    const d = new Date(base); d.setDate(d.getDate() - i);
    const iso = toLocalISO(d);
    days.push({ iso, val: dailyMap[iso] || 0, weekday: d.getDay() });
  }
  const padded = Array(days[0].weekday).fill(null).concat(days);
  const weeks = [];
  for (let i = 0; i < padded.length; i += 7) weeks.push(padded.slice(i, i + 7));
  const maxAbsDay = Math.max(1, ...padded.filter(Boolean).map((d) => Math.abs(d.val)));

  let filteredTrades = [...enriched].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  if (state.filter === "profit") filteredTrades = filteredTrades.filter((t) => t.pnl > 0);
  if (state.filter === "loss") filteredTrades = filteredTrades.filter((t) => t.pnl < 0);
  if (state.search.trim()) {
    const q = state.search.trim().toUpperCase();
    filteredTrades = filteredTrades.filter((t) => (t.note || t.notes || "").toUpperCase().includes(q));
  }

  return { enriched, dailyMap, today, todayPnl, totalPnl, wins, winRate, limitNum, limitPct, limitBreached, equityData, weeks, maxAbsDay, filteredTrades };
}

/* ---------- render pieces ---------- */
function heatmapHTML(weeks, maxAbsDay) {
  const dayLabels = ["", "Mon", "", "Wed", "", "Fri", ""];
  const labelsCol = `<div style="display:flex;flex-direction:column;gap:3px;margin-right:7px;flex-shrink:0;">` +
    dayLabels.map((l) => `<div style="width:18px;height:11px;font-size:8px;line-height:11px;color:var(--text-faint);font-family:var(--font-mono);">${l}</div>`).join("") +
    `</div>`;
  const grid = `<div style="display:flex;gap:3px;justify-content:space-between;flex:1;">` +
    weeks.map((week) => `<div style="display:flex;flex-direction:column;gap:3px;">` +
      week.map((d) => {
        if (!d) return `<div style="width:11px;height:11px;"></div>`;
        const intensity = d.val === 0 ? 0 : Math.max(0.2, Math.abs(d.val) / maxAbsDay);
        const color = d.val > 0 ? "var(--profit)" : d.val < 0 ? "var(--loss)" : "var(--bg-elev)";
        const opacity = d.val === 0 ? 1 : Math.min(1, intensity + 0.25);
        const isToday = d.iso === todayISO();
        const ring = isToday ? "box-shadow:0 0 0 1.5px var(--accent);" : "";
        return `<div class="heat-cell" title="${d.iso}: ${fmtMoney(d.val)}" style="background:${color};opacity:${opacity};${ring}"></div>`;
      }).join("") + `</div>`
    ).join("") + `</div>`;
  return `<div style="display:flex;align-items:flex-start;">${labelsCol}${grid}</div>`;
}

function equitySVG(equityData) {
  if (equityData.length < 2) {
    return `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-faint);font-size:12px;text-align:center;padding:0 20px;">Two entries draw the first line — log another to watch it take shape</div>`;
  }
  const w = 340, h = 150, pad = 10;
  const values = equityData.map((d) => d.equity);
  const min = Math.min(0, ...values), max = Math.max(0, ...values);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (equityData.length - 1);
  const pts = equityData.map((d, i) => {
    const x = pad + i * stepX;
    const y = pad + (h - pad * 2) * (1 - (d.equity - min) / range);
    return [x, y];
  });
  const zeroY = pad + (h - pad * 2) * (1 - (0 - min) / range);
  const line = pts.map((p) => p.join(",")).join(" ");
  const areaPts = `${pad},${zeroY} ` + line + ` ${pad + (equityData.length - 1) * stepX},${zeroY}`;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="width:100%;height:100%;">
    <defs><linearGradient id="eqgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a15a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a15a" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${pad}" y1="${zeroY}" x2="${w - pad}" y2="${zeroY}" stroke="#3a3f4d" stroke-width="1"/>
    <polygon points="${areaPts}" fill="url(#eqgrad)"/>
    <polyline points="${line}" fill="none" stroke="#c9a15a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function tradeCardHTML(t) {
  const arrow = t.pnl >= 0 ? ICONS.up : ICONS.down;
  const bg = t.pnl >= 0 ? "var(--profit-soft)" : "var(--loss-soft)";
  const iconColor = t.pnl >= 0 ? "var(--profit)" : "var(--loss)";
  return `<div class="card trade-card">
    <div style="width:34px;height:34px;border-radius:10px;flex-shrink:0;background:${bg};display:flex;align-items:center;justify-content:center;color:${iconColor};">
      <span class="icon" style="width:16px;height:16px;">${arrow}</span>
    </div>
    <div style="flex:1;min-width:0;">
      <div class="mono" style="font-size:13px;color:var(--text-dim);">${t.date}</div>
      ${(t.note || t.notes) ? `<div style="font-size:12px;color:var(--text-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.note || t.notes)}</div>` : ""}
    </div>
    <div style="text-align:right;flex-shrink:0;">
      <div class="mono ${pnlClass(t.pnl || 0)}" style="font-weight:700;font-size:14.5px;">${fmtMoney(t.pnl)}</div>
      <div style="display:flex;gap:2px;margin-top:4px;justify-content:flex-end;">
        <button class="btn btn-ghost" data-action="edit" data-id="${t.id}" style="color:var(--text-faint);" aria-label="Edit entry"><span class="icon" style="width:15px;height:15px;">${ICONS.pencil}</span></button>
        <button class="btn btn-ghost" data-action="delete" data-id="${t.id}" style="color:var(--text-faint);" aria-label="Delete entry"><span class="icon" style="width:15px;height:15px;">${ICONS.trash}</span></button>
      </div>
    </div>
  </div>`;
}

      <div>
        <div class="display" style="font-size:20px;font-weight:600;font-style:italic;letter-spacing:-0.01em;">Ledger</div>
        <div class="mono" style="font-size:10.5px;color:var(--text-faint);">${new Date().toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</div>
      </div>
      <div style="text-align:right;">
        <div class="stat-label">Today</div>
        <div id="today-pnl-el" class="hero-figure ${pnlClass(d.todayPnl)}" style="font-size:17px;">${fmtMoney(d.todayPnl)}</div>

    </div>
    ${state.saveError ? `<div style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--loss);margin-top:6px;"><span class="icon" style="width:11px;height:11px;">${ICONS.alert}</span> couldn't save changes</div>` : ""}

}

    <div class="hero-card home-hero">
      <div class="stat-label">Total P&L</div>
      <div id="hero-total-el" class="hero-figure ${pnlClass(d.totalPnl)}" style="font-size:34px;margin-top:6px;">${fmtMoney(d.totalPnl)}</div>
      <div style="display:flex;gap:18px;margin-top:14px;">
        <div><div class="stat-label">% Win rate</div><div class="mono" style="font-size:15px;font-weight:600;margin-top:2px;">${d.enriched.length ? d.winRate.toFixed(1) + "%" : "—"}</div></div>
        <div><div class="stat-label">Entries</div><div class="mono" style="font-size:15px;font-weight:600;margin-top:2px;">${d.enriched.length}</div></div>
      </div>
    </div>
    ${d.limitNum > 0 ? `<div class="card home-risk" style="padding:12px 14px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <span class="stat-label">Daily loss limit</span>

      </div>
      <div class="risk-track"><div class="risk-fill" style="width:${d.limitPct}%;background:${d.limitBreached ? "var(--loss)" : d.limitPct > 70 ? "var(--accent)" : "var(--profit)"};"></div></div>
      <div class="mono" style="font-size:10.5px;color:var(--text-faint);margin-top:5px;">${fmtMoney(Math.min(0, d.todayPnl))} of -$${d.limitNum}</div>
    </div>` : `<div class="card home-risk" style="padding:12px 14px;display:flex;align-items:center;justify-content:center;text-align:center;">
      <div>
        <div style="font-size:12px;color:var(--text-dim);">No daily loss limit set</div>
        <button class="btn btn-ghost" data-action="goto-settings" style="color:var(--accent);font-size:11.5px;margin-top:4px;padding:4px 8px;">Set one in Settings</button>

    </div>`}

      <div class="stat-label" style="margin-bottom:10px;">Last 8 weeks</div>
      ${heatmapHTML(d.weeks, d.maxAbsDay)}
    </div>
    <div class="home-recent">
      <div style="display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;">
        <span class="stat-label">Recent entries</span>
        <button class="btn btn-ghost" data-action="goto-trades" style="padding:3px 6px;font-size:11px;color:var(--accent);">see all</button>
      </div>
      ${recent.length === 0 ? `<div class="card" style="padding:28px 20px;text-align:center;"><div style="font-size:13px;color:var(--text-dim);margin-bottom:4px;">The ledger is empty</div><div style="font-size:11.5px;color:var(--text-faint);">Tap + to log today's result and start the tally</div></div>` : `<div class="recent-grid">${recent.map(tradeCardHTML).join("")}</div>`}
    </div>
  </div>`;
}

function renderTrades(d) {
  const filters = [["all", "All"], ["profit", "Profit"], ["loss", "Loss"]];
  return `
    <div class="trades-toolbar">
      <div class="search-bar">
        <span class="icon" style="width:13px;height:13px;color:#565b6a;">${ICONS.search}</span>
        <input id="search-input" placeholder="Search notes…" value="${esc(state.search)}">
      </div>
      <div style="display:flex;gap:6px;overflow-x:auto;">
        ${filters.map(([k, label]) => `<div class="chip ${state.filter === k ? "active" : ""}" data-action="filter" data-filter="${k}">${label}</div>`).join("")}
      </div>
    </div>
    ${d.filteredTrades.length === 0 ? `<div class="card" style="padding:28px;text-align:center;margin-top:12px;"><div style="font-size:13px;color:var(--text-dim);">Nothing here</div><div style="font-size:11.5px;color:var(--text-faint);margin-top:4px;">Try a different filter or search term</div></div>` : `<div class="trades-grid">${d.filteredTrades.map(tradeCardHTML).join("")}</div>`}
  `;
}

function renderStats(d) {
  const avgWin = d.wins ? d.enriched.filter(t => t.pnl > 0).reduce((s, t) => s + t.pnl, 0) / d.wins : 0;
  const lossCount = d.enriched.length - d.wins;
  const avgLoss = lossCount ? d.enriched.filter(t => t.pnl < 0).reduce((s, t) => s + t.pnl, 0) / lossCount : 0;
  return `<div class="stats-screen">
    <div class="card stats-equity" style="padding:14px;">
      <span class="stat-label">Equity curve</span>
      <div style="height:200px;margin-top:8px;">${equitySVG(d.equityData)}</div>
    </div>
    <div class="card stats-breakdown" style="padding:14px;">
      <div class="stat-label" style="margin-bottom:10px;">Breakdown</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div><div class="stat-label">Profit days</div><div class="mono pnl-pos" style="font-size:16px;font-weight:700;">${d.wins}</div></div>
        <div><div class="stat-label">Loss days</div><div class="mono pnl-neg" style="font-size:16px;font-weight:700;">${lossCount}</div></div>
        <div><div class="stat-label">Avg profit</div><div class="mono pnl-pos" style="font-size:14px;">${fmtMoney(avgWin)}</div></div>
        <div><div class="stat-label">Avg loss</div><div class="mono pnl-neg" style="font-size:14px;">${fmtMoney(avgLoss)}</div></div>
      </div>
    </div>
    <div class="card stats-heat" style="padding:14px;">
      <div class="stat-label" style="margin-bottom:10px;">Daily P&L · last 8 weeks</div>
      ${heatmapHTML(d.weeks, d.maxAbsDay)}
    </div>
  </div>`;
}

      </div>

function sheetFormHTML(existing) {
  const t = existing || { type: "profit", amount: "", date: todayISO(), note: "" };
  const existingPnl = existing ? computePnl(existing) : 0;
  const type = existing ? (existingPnl < 0 ? "loss" : "profit") : "profit";
  const amount = existing ? Math.abs(existingPnl).toString() : "";
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px;">
      <span class="display" style="font-size:16px;font-weight:700;">${existing ? "Edit Entry" : "Log P&L"}</span>
      <button class="btn btn-ghost" data-action="close-sheet" style="color:var(--text-faint);" aria-label="Close"><span class="icon" style="width:16px;height:16px;">${ICONS.x}</span></button>
    </div>
    <form id="trade-form">
      <div style="margin-bottom:14px;">
        <label class="field-label">Result</label>
        <div style="display:flex;gap:6px;background:var(--bg);padding:3px;border-radius:9px;border:1px solid var(--border);">
          <div class="seg-btn seg-long ${type === "profit" ? "active" : ""}" data-action="set-side" data-side="profit" id="seg-long">PROFIT</div>
          <div class="seg-btn seg-short ${type === "loss" ? "active" : ""}" data-action="set-side" data-side="loss" id="seg-short">LOSS</div>
        </div>
        <input type="hidden" id="f-side" value="${type}">
      </div>
      <div style="margin-bottom:14px;">
        <label class="field-label">Amount</label>
        <div style="position:relative;">
          <span class="mono" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:14px;">$</span>
          <input id="f-amount" class="field-input" style="padding-left:26px;font-size:18px;font-weight:600;" type="number" step="any" min="0" placeholder="0.00" value="${esc(amount)}" required autofocus>
        </div>
      </div>
      <div style="margin-bottom:14px;">
        <label class="field-label">Date</label>
        <input id="f-date" class="field-input" type="date" value="${esc(t.date)}" max="${esc(todayISO())}">
      </div>
      <div style="margin-bottom:18px;">
        <label class="field-label">Note <span style="opacity:0.6;">(optional)</span></label>
        <input id="f-note" class="field-input" placeholder="e.g. NIFTY scalps, revenge trade…" value="${esc(t.note || t.notes || '')}">
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%;">
        <span class="icon" style="width:14px;height:14px;">${ICONS.plus}</span> ${existing ? "Save changes" : "Add entry"}
      </button>
    </form>
  `;
}

/* ---------- main render ---------- */
function render() {
  const root = document.getElementById("app-root");
  if (!state.loaded) {
    root.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;width:100%;"><div class="mono" style="color:var(--text-faint);font-size:13px;">loading ledger…</div></div>`;
    return;
  }
  const d = getDerived();
  const screens = { home: renderHome, trades: renderTrades, stats: renderStats, settings: renderSettings };
  const showFab = state.tab === "home" || state.tab === "trades";
  const navItems = [["home", "Home", ICONS.home], ["trades", "Trades", ICONS.rows], ["stats", "Stats", ICONS.chart], ["settings", "Settings", ICONS.settings]];
  const editingTrade = state.editingId ? state.trades.find((t) => t.id === state.editingId) : null;

  root.innerHTML = `
    <div class="app-shell">
      <div class="bottomnav">
        <div class="sidebar-header">
          <div class="display" style="font-size:19px;font-weight:600;font-style:italic;letter-spacing:-0.01em;">Ledger</div>
          <div class="mono" style="font-size:10.5px;color:var(--text-faint);margin-top:2px;">Trading journal</div>
        </div>
        <button class="btn btn-accent sidebar-add-btn" data-action="open-add">
          <span class="icon" style="width:14px;height:14px;">${ICONS.plus}</span> Add entry
        </button>
        ${navItems.map(([k, label, icon]) => `<button class="nav-item ${state.tab === k ? "active" : ""}" data-action="tab" data-tab="${k}">${icon}${label}</button>`).join("")}
      </div>
      <div class="app-main">
        <div class="topbar" id="topbar">${renderTopbar(d)}</div>
        <div class="screen" id="screen">${screens[state.tab](d)}</div>
      </div>
    </div>
    ${showFab ? `<button class="fab ${state.trades.length === 0 ? "invite" : ""}" data-action="open-add" aria-label="Add entry"><span class="icon" style="width:22px;height:22px;">${ICONS.plus}</span></button>` : ""}
    <div class="sheet-backdrop ${state.sheetOpen ? "open" : ""}" data-action="close-sheet"></div>
    <div class="sheet ${state.sheetOpen ? "open" : ""}">
      <div class="sheet-handle"></div>
      <div class="sheet-body">${sheetFormHTML(editingTrade)}</div>
    </div>
  `;
  const installBtn = document.getElementById("install-btn");
  if (installBtn && deferredInstallPrompt) installBtn.style.display = "inline-flex";
  attachEvents();
  animateCountUp(document.getElementById("hero-total-el"), prevTotalShown, d.totalPnl, 550, { get id() { return totalCountUpFrame; }, set id(v) { totalCountUpFrame = v; } });
  animateCountUp(document.getElementById("today-pnl-el"), prevTodayShown, d.todayPnl, 550, { get id() { return todayCountUpFrame; }, set id(v) { todayCountUpFrame = v; } });
  prevTotalShown = d.totalPnl;
  prevTodayShown = d.todayPnl;
  if (state.sheetOpen) {
    const amountInput = document.getElementById("f-amount");
    if (amountInput) setTimeout(() => amountInput.focus(), 260);
  }
}

function saveTab() {
  try { localStorage.setItem("journal_html:tab", state.tab); } catch (e) {}
}

/* ---------- events ---------- */
function attachEvents() {
  document.querySelectorAll("[data-action]").forEach((el) => {
    const action = el.getAttribute("data-action");
    el.addEventListener("click", (e) => {
      switch (action) {
        case "tab": state.tab = el.getAttribute("data-tab"); saveTab(); render(); break;
        case "goto-trades": state.tab = "trades"; saveTab(); render(); break;
        case "goto-settings": state.tab = "settings"; saveTab(); render(); break;
        case "open-add": state.editingId = null; state.sheetOpen = true; render(); break;
        case "close-sheet": state.sheetOpen = false; state.editingId = null; render(); break;
        case "edit": state.editingId = el.getAttribute("data-id"); state.sheetOpen = true; render(); break;
        case "delete": {
          const id = el.getAttribute("data-id");
          persistTrades(state.trades.filter((t) => t.id !== id));
          break;
        }
        case "filter": state.filter = el.getAttribute("data-filter"); render(); break;
        case "set-side": {
          const side = el.getAttribute("data-side");
          document.getElementById("f-side").value = side;
          document.getElementById("seg-long").classList.toggle("active", side === "profit");
          document.getElementById("seg-short").classList.toggle("active", side === "loss");
          break;
        }
      }
    });
  });

  const searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      const cursor = e.target.selectionStart;
      render();
      const again = document.getElementById("search-input");
      if (again) { again.focus(); again.setSelectionRange(cursor, cursor); }
    });
  }

  const limitInput = document.getElementById("limit-input");
  if (limitInput) {
    limitInput.addEventListener("input", (e) => {
      const cursor = e.target.selectionStart;
      persistSettings(e.target.value).then(() => {
        const again = document.getElementById("limit-input");
        if (again) { again.value = e.target.value; again.focus(); again.setSelectionRange(cursor, cursor); }
      });
    });
  }

  const exportBtn = document.getElementById("export-btn");
  if (exportBtn) {
    exportBtn.addEventListener("click", () => {
      const payload = { trades: state.trades, dailyLimit: state.dailyLimit, exportedAt: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ledger-backup-${todayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  }

  const importBtn = document.getElementById("import-btn");
  const importFileInput = document.getElementById("import-file-input");
  if (importBtn && importFileInput) {
    importBtn.addEventListener("click", () => importFileInput.click());
    importFileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const status = document.getElementById("import-status");
        try {
          const parsed = JSON.parse(reader.result);
          if (!Array.isArray(parsed.trades)) throw new Error("bad format");
          persistTrades(parsed.trades);
          if (parsed.dailyLimit !== undefined && parsed.dailyLimit !== null) persistSettings(parsed.dailyLimit);
          if (status) { status.textContent = `Restored ${parsed.trades.length} entries from backup.`; status.style.color = "var(--text-faint)"; }
        } catch (err) {
          if (status) { status.textContent = "Couldn't read that file — is it a Ledger backup?"; status.style.color = "var(--loss)"; }
        }
      };
      reader.readAsText(file);
      importFileInput.value = "";
    });
  }

  const form = document.getElementById("trade-form");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const amountRaw = document.getElementById("f-amount").value;
      if (!amountRaw || isNaN(Number(amountRaw))) return;
      const side = document.getElementById("f-side").value;
      const amount = Math.abs(Number(amountRaw));
      const record = {
        id: state.editingId || uid(),
        pnl: side === "loss" ? -amount : amount,
        date: document.getElementById("f-date").value || todayISO(),
        note: document.getElementById("f-note").value || "",
      };
      const next = state.editingId
        ? state.trades.map((t) => (t.id === state.editingId ? record : t))
        : [record, ...state.trades];
      state.sheetOpen = false;
      state.editingId = null;
      persistTrades(next);
    });
  }
}

/* ---------- PWA install prompt ---------- */
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById("install-btn");
  if (btn) btn.style.display = "inline-flex";
});
function triggerInstall() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    const btn = document.getElementById("install-btn");
    if (btn) btn.style.display = "none";
  });
}
window.triggerInstall = triggerInstall;

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ---------- boot ---------- */
loadData();
</script>
